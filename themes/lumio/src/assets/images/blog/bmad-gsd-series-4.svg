<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="55%" stop-color="#0F1A3D"/>
      <stop offset="100%" stop-color="#131B3A"/>
    </linearGradient>
    <linearGradient id="footerBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>

  <g stroke="#2E3A5C" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>
  <g fill="#22D3EE" opacity="0.6">
    <circle cx="150" cy="560" r="2.5"/>
    <circle cx="330" cy="560" r="2.5"/>
    <circle cx="510" cy="560" r="2.5"/>
    <circle cx="690" cy="580" r="2.5"/>
    <circle cx="870" cy="580" r="2.5"/>
    <circle cx="1050" cy="580" r="2.5"/>
  </g>

  <!-- routing fork: the work splits toward BMad or GSD -->
  <line x1="880" y1="440" x2="880" y2="400" stroke="#8B98C4" stroke-width="4"/>
  <path d="M 855 440 L 905 440 L 880 470 Z" fill="#3B4A72"/>
  <text x="880" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#C7D0EA">THE WORK</text>

  <line x1="880" y1="400" x2="760" y2="230" stroke="#7A4A2E" stroke-width="4"/>
  <path d="M 762 215 L 745 255 L 785 250 Z" fill="#FB923C"/>
  <line x1="880" y1="400" x2="1000" y2="230" stroke="#1B5E6B" stroke-width="4"/>
  <path d="M 998 215 L 975 250 L 1015 255 Z" fill="#22D3EE"/>

  <circle cx="760" cy="185" r="34" fill="#FB923C"/>
  <text x="760" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#131B3A">BMAD</text>

  <circle cx="1000" cy="185" r="34" fill="#22D3EE"/>
  <text x="1000" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#131B3A">GSD</text>

  <!-- kicker -->
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#22D3EE">BMad Method Vs GSD Core &#183; PART 4 OF 5</text>

  <!-- title -->
  <text x="70" y="248" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC">The Enterprise</text>
  <text x="70" y="306" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC">Tradeoffs, and When</text>
  <text x="70" y="364" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC">to Use Which</text>

  <!-- divider -->
  <rect x="70" y="392" width="90" height="6" rx="3" fill="url(#footerBar)"/>

  <!-- footer bar -->
  <rect x="0" y="606" width="1200" height="24" fill="url(#footerBar)"/>

  <g transform="translate(70, 540)">
    <rect x="0" y="18" width="8" height="14" fill="#22D3EE"/>
