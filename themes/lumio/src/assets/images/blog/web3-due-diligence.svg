<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="55%" stop-color="#0F1A3D"/>
      <stop offset="100%" stop-color="#131B3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footerBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- faint data-flow lines for texture -->
  <g stroke="#2E3A5C" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>
  <g fill="#22D3EE" opacity="0.6">
    <circle cx="150" cy="560" r="2.5"/>
    <circle cx="330" cy="560" r="2.5"/>
    <circle cx="510" cy="560" r="2.5"/>
    <circle cx="690" cy="580" r="2.5"/>
    <circle cx="870" cy="580" r="2.5"/>
    <circle cx="1050" cy="580" r="2.5"/>
  </g>

  <!-- glow behind audit icon -->
  <circle cx="860" cy="300" r="260" fill="url(#glow)"/>

  <!-- radiating lines to DD category nodes -->
  <g stroke="#3B4A72" stroke-width="2">
    <line x1="860" y1="300" x2="1040" y2="160"/>
    <line x1="860" y1="300" x2="1090" y2="300"/>
    <line x1="860" y1="300" x2="1040" y2="440"/>
    <line x1="860" y1="300" x2="905" y2="490"/>
    <line x1="860" y1="300" x2="735" y2="430"/>
    <line x1="860" y1="300" x2="750" y2="170"/>
  </g>

  <!-- category nodes -->
  <g>
    <!-- Smart Contracts -->
    <rect x="1008" y="139" width="64" height="42" rx="6" fill="#1B2547" stroke="#3B4A72" stroke-width="2"/>
    <circle cx="1040" cy="160" r="5" fill="#FB923C"/>
    <text x="1040" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#A8B4D0">CONTRACTS</text>

    <!-- Node Infrastructure -->
    <rect x="1058" y="279" width="64" height="42" rx="6" fill="#1B2547" stroke="#3B4A72" stroke-width="2"/>
    <circle cx="1090" cy="300" r="5" fill="#22D3EE"/>
    <text x="1090" y="339" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#A8B4D0">NODES</text>

    <!-- Key Management -->
    <rect x="1008" y="419" width="64" height="42" rx="6" fill="#1B2547" stroke="#3B4A72" stroke-width="2"/>
    <circle cx="1040" cy="440" r="5" fill="#FB923C"/>
    <text x="1040" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#A8B4D0">KEYS</text>

    <!-- Oracles / Bridges -->
    <rect x="873" y="469" width="64" height="42" rx="6" fill="#1B2547" stroke="#3B4A72" stroke-width="2"/>
    <circle cx="905" cy="490" r="5" fill="#22D3EE"/>
    <text x="905" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#A8B4D0">BRIDGES</text>

    <!-- Tokenomics -->
    <rect x="703" y="409" width="64" height="42" rx="6" fill="#1B2547" stroke="#3B4A72" stroke-width="2"/>
    <circle cx="735" cy="430" r="5" fill="#FB923C"/>
    <text x="735" y="469" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#A8B4D0">TOKENOMICS</text>

    <!-- Operational Maturity -->
    <rect x="718" y="149" width="64" height="42" rx="6" fill="#1B2547" stroke="#3B4A72" stroke-width="2"/>
    <circle cx="750" cy="170" r="5" fill="#22D3EE"/>
    <text x="750" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#A8B4D0">OPS</text>
  </g>

  <!-- concentric audit-scan rings -->
  <circle cx="860" cy="300" r="95" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.55"/>
  <circle cx="860" cy="300" r="130" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.35"/>
  <circle cx="860" cy="300" r="165" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.2"/>

  <!-- central shield + checkmark (verified infrastructure) -->
  <circle cx="860" cy="300" r="55" fill="#FB923C"/>
  <path d="M 860 268 L 882 277 L 882 300 Q 882 322 860 333 Q 838 322 838 300 L 838 277 Z" fill="#0A0E27"/>
  <path d="M 848 299 L 857 309 L 875 288" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- kicker -->
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#22D3EE">WEB3 / INFRASTRUCTURE DUE DILIGENCE</text>

  <!-- title -->
  <text x="70" y="224" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">What Technical Due Diligence</text>
  <text x="70" y="272" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Really Means</text>

  <!-- subtitle -->
  <text x="70" y="314" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#A8B4D0">for Web3 Infrastructure</text>

  <!-- divider -->
  <rect x="70" y="340" width="90" height="6" rx="3" fill="url(#footerBar)"/>

  <!-- footer bar -->
  <rect x="0" y="606" width="1200" height="24" fill="url(#footerBar)"/>

  <!-- site mark: small ABR bars logomark + wordmark -->
  <g transform="translate(70, 540)">
    <rect x="0" y="18" width="8" height="14" fill="#22D3EE"/>
    <rect x="12" y="10" width="8" height="22" fill="#22D3EE"/>
    <rect x="24" y="2" width="8" height="30" fill="#FB923C"/>
    <text x="46" y="26" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#F8FAFC">AskRyc</text>
  </g>
</svg>
