<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="titleId descId">
  <title id="titleId">The Modern OTT Streaming Architecture - AskRyc</title>
  <desc id="descId">Header graphic for blog post on modern OTT streaming architecture, scalable video delivery, and high-quality experiences</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" gradientTransform="rotate(135)" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1a1433"/>
      <stop offset="100%" stop-color="#1e1135"/>
    </linearGradient>

    <!-- Play button gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Accent gradient for underline -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow filter for play button -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle tech scanlines -->
  <g opacity="0.06" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Flowing data/stream paths (content delivery) -->
  <g opacity="0.22">
    <path d="M 320 285 Q 520 245 760 265" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="5 3"/>
    <path d="M 300 315 Q 540 295 760 305" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M 340 345 Q 500 355 760 335" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="6 2"/>
  </g>

  <!-- Video Player Frame -->
  <rect x="760" y="165" width="365" height="265" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="14"/>
  <!-- Inner frame highlight -->
  <rect x="775" y="180" width="335" height="235" rx="14" ry="14" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.5"/>

  <!-- Screen -->
  <rect x="790" y="200" width="305" height="195" rx="10" ry="10" fill="#0f172a"/>
  <!-- Subtle screen sheen -->
  <rect x="790" y="200" width="305" height="195" rx="10" ry="10" fill="url(#playGrad)" opacity="0.05"/>

  <!-- Glowing Play Button -->
  <circle cx="942" cy="297" r="50" fill="url(#playGrad)" filter="url(#glow)"/>
  <!-- Play triangle -->
  <polygon points="920,272 920,322 980,297" fill="#0f172a"/>

  <!-- Architecture nodes -->
  <!-- CDN node (top) -->
  <circle cx="875" cy="125" r="19" fill="#1e293b" stroke="#22d3ee" stroke-width="3.5"/>
  <text x="875" y="130" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle">CDN</text>
  <line x1="875" y1="144" x2="825" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.45"/>

  <!-- EDGE node (top-right) -->
  <circle cx="1085" cy="195" r="17" fill="#1e293b" stroke="#a855f7" stroke-width="3.5"/>
  <text x="1085" y="200" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a855f7" text-anchor="middle">EDGE</text>
  <line x1="1068" y1="195" x2="1125" y2="220" stroke="#a855f7" stroke-width="2" opacity="0.45"/>

  <!-- API node (bottom) -->
  <circle cx="865" cy="425" r="17" fill="#1e293b" stroke="#22d3ee" stroke-width="3.5"/>
  <text x="865" y="430" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">API</text>
  <line x1="865" y1="408" x2="820" y2="380" stroke="#22d3ee" stroke-width="2" opacity="0.45"/>

  <!-- 4K HDR Badge -->
  <rect x="1055" y="415" width="78" height="30" rx="15" fill="#a855f7"/>
  <text x="1094" y="435" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4K • HDR</text>

  <!-- Branding -->
  <text x="70" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#22d3ee" letter-spacing="0.5">AskRyc</text>
  <circle cx="168" cy="47" r="5" fill="#22d3ee"/>

  <!-- Main Title -->
  <text x="70" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="39" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">The Modern OTT</text>
  <text x="70" y="203" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="39" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">Streaming Architecture</text>

  <!-- Accent underline -->
  <rect x="70" y="218" width="435" height="5" rx="2.5" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="70" y="258" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#cbd5e1">Building Scalable, High-Quality</text>
  <text x="70" y="283" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#cbd5e1">Video Experiences?</text>

  <!-- Bottom tagline -->
  <text x="70" y="590" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b" opacity="0.65">Technical Architecture  •  Video Engineering  •  Scalable Systems</text>
</svg>